name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: turbo-web/package-lock.json

      - name: Install deps
        run: npm ci
        working-directory: turbo-web

      - name: Build
        run: npm run build
        working-directory: turbo-web

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: turbo-web/dist
          branch: gh-pages
          clean: true
